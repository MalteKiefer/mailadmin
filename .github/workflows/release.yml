name: release

# Build static Linux binaries and publish a GitHub release whenever a version
# tag (vX.Y.Z) is pushed. The self-update command in `mailadmin` consumes the
# assets produced here (mailadmin-linux-<arch> + SHA256SUMS).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the GitHub release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build linux binaries
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X mailadmin/internal/cli.Version=${VERSION}" \
              -o "dist/mailadmin-linux-${arch}" ./cmd/mailadmin
          done
          ls -l dist

      # SBOM (CycloneDX) describing the module's full dependency graph
      # (go.mod/go.sum), so consumers of the release can check the binaries'
      # provenance/composition against CVE feeds without rebuilding. Generated
      # from source rather than per-binary since both arch builds share one
      # dependency graph.
      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/mailadmin-${{ github.ref_name }}.cdx.json

      - name: Checksums
        run: |
          set -euo pipefail
          cp defaults/config.default.toml dist/config.default.toml
          ( cd dist && sha256sum mailadmin-linux-* *.cdx.json config.default.toml > SHA256SUMS )
          cat dist/SHA256SUMS

      # Detached signature over SHA256SUMS. selfupdate refuses a release without it, and
      # verifies it against the release key pinned in internal/selfupdate. The key and
      # passphrase come from repository secrets. The passphrase goes to gpg on stdin,
      # not on the command line.
      - name: Sign checksums
        env:
          RELEASE_GPG_KEY: ${{ secrets.RELEASE_GPG_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          RELEASE_KEY_ID: AB222289126C59D40BDFC707C82C7B375578C141
        run: |
          set -euo pipefail
          test -n "$RELEASE_GPG_KEY" || { echo "RELEASE_GPG_KEY secret is not set" >&2; exit 1; }
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$RELEASE_GPG_KEY" | gpg --batch --import
          fpr=$(gpg --batch --with-colons --list-secret-keys "$RELEASE_KEY_ID" | awk -F: '$1 == "fpr" { print $10; exit }')
          [ "$fpr" = "$RELEASE_KEY_ID" ] || { echo "imported key $fpr is not the pinned release key" >&2; exit 1; }
          printf '%s' "$RELEASE_GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --local-user "$RELEASE_KEY_ID" \
            --armor --detach-sign --output dist/SHA256SUMS.asc dist/SHA256SUMS
          gpg --batch --verify dist/SHA256SUMS.asc dist/SHA256SUMS
          rm -rf "$GNUPGHOME"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
