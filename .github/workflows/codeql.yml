name: codeql

# Static application-security-testing (SAST) via GitHub's CodeQL. Catches the
# class of bug that gosec/staticcheck don't specialize in: cross-function
# taint-flow issues (e.g. a value that looks validated at the call site but
# isn't actually sanitized on the path that reaches a sink), which matters
# here given how much of this CLI's job is turning untrusted-ish input
# (addresses, domains, CIDRs, ports) into arguments for privileged exec calls.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly, independent of any push, so a newly-published CodeQL query pack
    # still catches something in unchanged code.
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # required to upload CodeQL results to the Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: go

      - name: autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

      - name: analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: '/language:go'
