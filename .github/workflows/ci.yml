name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

# Default to read-only; jobs below don't need more.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { echo 'gofmt needed:'; gofmt -l .; exit 1; }

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test (race)
        run: go test -race ./...

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...

      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest -quiet ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

  test-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # internal/db/integration_test.go (//go:build integration) exercises the
    # pgx CRUD layer against a real Postgres. It is fully self-contained: on
    # each test it CREATEs a uniquely-named schema, runs its own embedded
    # DDL (testSchemaDDL — reconstructed from what db.go/apppw.go actually
    # SELECT/INSERT), points a pool at it via `options=-c search_path=...`,
    # and DROPs the schema again in t.Cleanup. It never touches migrations/
    # or the public schema, so migrations/001_baseline.sql and
    # 002_dns_provider.sql are deliberately NOT applied here: 001's GRANT
    # block targets roles (mailadmin/postfix/dovecot) that don't exist on a
    # bare service container, so blindly `psql -f`-ing it would just fail —
    # and even if it succeeded, the test doesn't read those tables. All this
    # job needs is a reachable Postgres the test role can CREATE SCHEMA on.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: build (integration tag)
        run: go build -tags integration ./...

      - name: test (integration, real Postgres)
        env:
          TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test -tags integration ./internal/db/... -v

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Coverage floor: a regression guard, not a target. Baseline measured
      # 2026-08-30 was 25.1% total statements (`go tool cover -func`), pulled
      # down by packages with no test files (internal/db, internal/valid) and
      # internal/cli's largely-untested cobra RunE bodies (exercised in
      # practice via manual/integration use, not unit tests). The floor sits
      # a few points under that so ordinary fluctuation doesn't false-positive,
      # while a real drop (e.g. a large new package landing untested) still
      # fails CI. Ratchet this up as coverage improves — see docs/CI-SECURITY.md.
      - name: coverage floor (20%)
        run: |
          set -euo pipefail
          go test -coverprofile=coverage.out ./...
          pct=$(go tool cover -func=coverage.out | tail -1 | grep -oE '[0-9]+\.[0-9]+' | tail -1)
          echo "total coverage: ${pct}%"
          floor=20.0
          awk -v p="$pct" -v f="$floor" 'BEGIN { exit !(p >= f) }' \
            || { echo "coverage ${pct}% is below the ${floor}% floor"; exit 1; }
