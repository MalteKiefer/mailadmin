name: dependency-review

# Flags newly-introduced dependencies in a PR diff that carry a known
# vulnerability or an incompatible/disallowed license. This repo pushes
# directly to main today (no PRs), so this workflow is currently dormant:
# it exists so the check is ready and consistent the moment PRs are used
# (Dependabot PRs, or a human contributor's PR), rather than being bolted on
# after the fact. See docs/CI-SECURITY.md for the branch-protection change
# that would make this (and the other PR-gated checks) actually enforced.
on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # posts the findings summary as a PR comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
